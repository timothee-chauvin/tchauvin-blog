{%- comment -%}
The "Copy for LLM" pill. Pairs with copy_llm.html, which binds one click handler
to every button.copy-pill on the page.
Parameters: include.src (the generated .md to fetch), include.label (aria-label).
{%- endcomment -%}
<button class="copy-pill" type="button" aria-label="{{ include.label | escape }}"
        data-src="{{ include.src | relative_url }}">
  <span class="copy-pill-icon">
    <!-- icon: Lucide copy, ISC License -->
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="9" width="11" height="11" rx="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
  </span>
  <span class="copy-pill-label">Copy for LLM</span>
</button>
